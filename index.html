<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinkbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Lexend:wght@400;500;600&amp;display=swap">
<style>
:root {
  /* Layout: quiet chrome around a graph-paper workspace; the piece tray (or the coach panel) docks under the workspace on phones and beside it on wide screens. */
  --paper: #F1F4F8;
  --grid: #D9E1EB;
  --panel: #FFFFFF;
  --ink: #18233A;
  --muted: #5A6A80;
  --line: #D3DBE6;
  --accent: #0A7A84;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFF0;
  --ok: #1E8A55;
  --warn: #A8620C;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(24, 35, 58, .08), 0 6px 18px rgba(24, 35, 58, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1621; --grid: #1C2837; --panel: #172130; --ink: #E5ECF5; --muted: #97A7BC; --line: #2A394C;
    --accent: #3CC2CC; --accent-ink: #052A2E; --accent-soft: #15383F; --ok: #4CC38A; --warn: #E9A23B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1621; --grid: #1C2837; --panel: #172130; --ink: #E5ECF5; --muted: #97A7BC; --line: #2A394C;
  --accent: #3CC2CC; --accent-ink: #052A2E; --accent-soft: #15383F; --ok: #4CC38A; --warn: #E9A23B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button, input, textarea { font: inherit; color: inherit; }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); -webkit-user-select: none; user-select: none; }
#app > .bar { grid-row: 1; } #app > .tools { grid-row: 2; } #app > .stage { grid-row: 3; }
input, textarea { -webkit-user-select: text; user-select: text; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { width: 26px; height: 26px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 20px; white-space: nowrap; }
.brand-sub { color: var(--muted); font-size: 13px; white-space: nowrap; }
@media (max-width: 760px) { .brand-sub { display: none; } }
@media (max-width: 440px) { .brand-name { display: none; } }
.live-pill { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 32px; padding: 0 12px; margin-right: auto; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.live-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live-pill.on i { background: #2FA36B; box-shadow: 0 0 0 3px rgba(47, 163, 107, .25); }
.live-pill.wait i { background: #F5C842; }
.actions { display: flex; gap: 2px; flex: none; }
.ib { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; touch-action: manipulation; }
.ib svg { width: 22px; height: 22px; }
.ib:hover { background: var(--accent-soft); }
.ib[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ib:disabled { opacity: .35; cursor: default; background: transparent; color: var(--ink); }
.ib.sm { width: 34px; height: 34px; }
.ib.sm svg { width: 18px; height: 18px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body.coachmode .kidonly, body:not(.coachmode) .coachonly { display: none !important; }

/* tool switcher */
.tools { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
.chip:hover { border-color: var(--muted); }
.chip[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
body.coachmode .chip { cursor: default; }
@media (max-width: 899px) { body.coachmode .tools { display: none; } }
body.coachmode .chip:not([aria-selected="true"]) { opacity: .45; }

/* workspace */
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.ws-wrap { position: relative; min-height: 0; overflow: hidden; }
#ws { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#ws.penmode { cursor: crosshair; }
#ws text { font-family: var(--font-body); }

.hud { position: absolute; top: 12px; left: 12px; right: 64px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
.nozoom .hud { right: 12px; }
.readout { max-width: min(100%, 540px); padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.big { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.3; text-wrap: balance; }
.big small { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--muted); }
.sub { font-size: 13px; color: var(--muted); }
.hint { margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--accent); }
.gb-row { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 6px; font-size: 13.5px; }
.gb-row b { font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .62em; line-height: 1.05; margin: 0 .08em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .15em; }

/* task card */
.tcard { pointer-events: auto; width: min(100%, 470px); padding: 10px 12px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; box-shadow: var(--shadow); }
.tc-top { display: flex; align-items: center; gap: 6px; }
.tc-k { margin-right: auto; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tc-p { margin: 4px 0 10px; font-size: 15.5px; font-weight: 500; text-wrap: pretty; }
.tc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.tc-in { width: 150px; min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 16px; }
.tc-fb { margin-bottom: 10px; padding: 7px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; }
.tc-fb.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tc-fb.no { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.tc-hint { margin: -4px 0 10px; font-size: 13.5px; color: var(--muted); }
.tc-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.tc-meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.btn { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 14px; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: default; }

.zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom .ib { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }

.ctx { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; max-width: calc(100% - 24px); overflow-x: auto; background: var(--ink); color: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
.ctx button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; font-size: 11.5px; font-weight: 500; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
.ctx button:hover { background: color-mix(in srgb, var(--panel) 18%, transparent); }
.ctx svg { width: 20px; height: 20px; }
body.dragging .ctx { display: none; }

.trash { position: absolute; right: 12px; bottom: 12px; width: 60px; height: 60px; display: grid; place-items: center; border: 2px dashed var(--muted); border-radius: 50%; background: var(--panel); color: var(--muted); opacity: 0; transform: scale(.85); transition: opacity .15s, transform .15s; pointer-events: none; }
.trash svg { width: 26px; height: 26px; }
body.dragging .trash { opacity: 1; transform: scale(1); }
.trash.hot { background: #E5484D; border: 2px solid #E5484D; color: #fff; transform: scale(1.12); }

.penbar { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.sw { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 2px solid transparent; border-radius: 50%; background: transparent; cursor: pointer; }
.sw i { width: 20px; height: 20px; border-radius: 50%; display: block; }
.sw[aria-pressed="true"] { border-color: var(--accent); }

.toast { position: absolute; left: 50%; bottom: 84px; z-index: 6; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px); padding: 8px 8px 8px 14px; background: var(--ink); color: var(--panel); border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; }
.tbtn { flex: none; border: 0; border-radius: 8px; padding: 6px 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.msgbar { position: absolute; left: 50%; top: 12px; z-index: 7; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 24px); padding: 10px 8px 10px 14px; background: var(--ink); color: var(--panel); border-radius: 12px; box-shadow: var(--shadow); font-size: 15px; font-weight: 500; }
.msgbar b { color: var(--accent); }

/* tray */
.tray { display: flex; gap: 18px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; overflow-y: hidden; background: var(--panel); border-top: 1px solid var(--line); touch-action: pan-x; scrollbar-width: thin; }
.sec { flex: none; display: flex; flex-direction: column; gap: 6px; }
.sec-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
.pbtn { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 11.5px; font-weight: 500; line-height: 1.15; text-align: center; cursor: grab; touch-action: pan-x; }
.pbtn:hover { border-color: var(--muted); }
.pbtn svg { width: 40px; height: 40px; overflow: visible; pointer-events: none; }
.opt { flex: none; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
.opt:hover { border-color: var(--muted); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.ghost { background: transparent; border-style: dashed; }
.opt.sq { min-width: 44px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.tlabel { flex: none; min-width: 64px; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 0; max-width: 190px; font-size: 12px; color: var(--muted); white-space: normal; }
@media (max-height: 640px) and (max-width: 899px) { .sec-h { display: none; } .tray { padding-top: 8px; } }

/* coach panel */
.coach { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-top: 1px solid var(--line); }
.ctabs { display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
.ctab { flex: 1; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
.ctab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.cbody { max-height: 38vh; overflow: auto; padding: 4px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.coach.collapsed .cbody { display: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
.stat { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.res { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.res time { width: 64px; flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.res .t { flex: 1; min-width: 0; }
.r-ok { color: var(--ok); font-weight: 700; }
.r-no { color: var(--warn); font-weight: 700; }
.topic-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13.5px; }
.topic-row span:first-child { width: 120px; flex: none; }
.bar-bg { flex: 1; height: 8px; border-radius: 4px; background: var(--paper); overflow: hidden; border: 1px solid var(--line); }
.bar-bg i { display: block; height: 100%; background: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.h3 { margin: 14px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (min-width: 900px) {
  .stage { grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  body.coachmode .stage { grid-template-columns: 360px minmax(0, 1fr); }
  .tray, .coach { grid-column: 1; grid-row: 1; }
  .tray { flex-direction: column; gap: 20px; padding: 16px; overflow-x: hidden; overflow-y: auto; border-top: 0; border-right: 1px solid var(--line); touch-action: pan-y; }
  .coach { border-top: 0; border-right: 1px solid var(--line); }
  .coach.collapsed .cbody { display: block; }
  .cbody { max-height: none; flex: 1; }
  .ws-wrap { grid-column: 2; grid-row: 1; }
  .row { flex-wrap: wrap; align-items: stretch; }
  .pbtn { touch-action: pan-y; }
  .note { max-width: none; }
}

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 16, 26, .45); }
.sheet { width: min(100%, 560px); max-height: 90%; display: flex; flex-direction: column; background: var(--panel); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { margin: 0 auto 0 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.sheet-b { overflow: auto; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); -webkit-user-select: text; user-select: text; }
.sheet-b p { margin: 8px 0; }
.tl-topic { margin: 16px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tl-item { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); text-align: left; font-size: 14.5px; font-weight: 500; cursor: pointer; }
.tl-item:hover { border-color: var(--muted); }
.tl-item.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tl-st { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 50%; font-size: 13px; font-weight: 700; }
.tl-st.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl-st.tried { border-color: var(--warn); color: var(--warn); }
.tl-sub { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 16px; }
.field textarea { min-height: 130px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.field textarea.plain { min-height: 84px; font-family: inherit; font-size: 16px; resize: vertical; }
.sel { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 16px; }
.choice-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.choice-row input { flex: 1; min-width: 0; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 16px; }
.checkrow { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: 14px; }
.checkrow input { width: 20px; height: 20px; accent-color: var(--accent); }
.tl-row { display: flex; align-items: flex-start; gap: 6px; }
.tl-row .tl-item { flex: 1; width: auto; min-width: 0; }
.tl-row .ib { margin-top: 4px; }
.btn.ch b { margin-right: 6px; color: var(--accent); }
.btn.ch[aria-pressed="true"] b { color: inherit; }
.tc-timer { flex: none; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tc-timer.low { background: #E5484D; color: #fff; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.cp-grid { display: grid; gap: 6px; margin-bottom: 4px; }
.cp { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation; }
.cp:hover { border-color: var(--muted); border-left-color: var(--accent); }
.cp b { font-size: 15px; font-weight: 600; }
.cp span { font-size: 12.5px; color: var(--muted); }
.cp .cp-last { color: var(--ok); font-weight: 600; }
.buildbar { pointer-events: auto; width: min(100%, 470px); padding: 10px 12px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 12px; box-shadow: var(--shadow); }
.steps { margin: 6px 0 14px; padding-left: 20px; } .steps li { margin-bottom: 6px; }
.err { margin: 8px 0; color: #E5484D; font-size: 14px; font-weight: 600; }
.okmsg { margin: 8px 0; color: var(--ok); font-size: 14px; font-weight: 600; }
.qr { width: 228px; margin: 10px auto; padding: 14px; background: #fff; border-radius: 12px; }
.qr svg { display: block; width: 200px; height: 200px; }
.linkbox { display: flex; gap: 6px; margin: 8px 0; }
.linkbox input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 13px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }

/* svg: shared */
.bg { fill: var(--paper); }
.bg.grid { fill: url(#gridpat); }
.pat-bg { fill: var(--paper); }
.pat-line { fill: none; stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.pc { cursor: grab; }
body.dragging .pc { cursor: grabbing; }
body.coachmode .pc { cursor: default; }
.selbox { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.mat { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
.mat-div { stroke: var(--line); stroke-width: 1.5; }
.mat-h { fill: var(--ink); font-family: var(--font-display) !important; font-weight: 600; font-size: 18px; text-anchor: middle; }
.fl, .at-l { font-weight: 600; text-anchor: middle; pointer-events: none; }
.rowsum { fill: var(--ink); font-family: var(--font-display) !important; font-weight: 600; font-size: 17px; pointer-events: none; }
.hit { fill: none; stroke: transparent; }

<script>
(() => {
"use strict";
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const uid = () => 'p' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const MINUS = '−';
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const plural = (n, one, many) => (n === 1 ? one : many || one + 's');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const rot = (v, deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };
function pip(poly, x, y) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;

}
// How much of the target shapes the pieces cover (cover), and how much of the pieces sit inside the targets (fit).
function coverage(polys, targets, step = 3) {
  const box = ps => { let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity; for (const p of ps) for (const [x, y] of p) { l = Math.min(l, x); t = Math.min(t, y); r = Math.max(r, x); b = Math.max(b, y); } return { l, t, r, b }; };
  const inAny = (ps, x, y) => ps.some(p => pip(p, x, y));

    let n = 0, hit = 0; if (!ps.length) return 0;
    const B = box(ps);
    for (let y = B.t + step / 2; y < B.b; y += step) for (let x = B.l + step / 2; x < B.r; x += step) if (inAny(ps, x, y)) { n++; if (inAny(other, x, y)) hit++; }

}
const targetSVG = d => (Array.isArray(d.target) ? d.target.map(p => `<polygon class="target" points="${p.map(q => `${r1(q[0])},${r1(q[1])}`).join(' ')}"/>`).join('') : '');

const C = {
  red:    { f: '#E5484D', s: '#B42F34', t: '#FFFFFF' },
  orange: { f: '#F48A2A', s: '#C0640D', t: '#2B1500' },
  yellow: { f: '#F5C842', s: '#C39A14', t: '#2B2200' },
  amber:  { f: '#FFB224', s: '#C68100', t: '#2B1C00' },

const ICON = {

  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

  brk: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
  trade: '<path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/>',

  empty: '<rect x="2" y="7" width="20" height="10" rx="1"/><path d="M8.7 7v10M15.3 7v10"/>',
  palette: '<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="12" cy="7.5" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;

/* fractions as text and as stacked HTML */
function fracParts(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); n /= g; d /= g; const neg = n < 0; n = Math.abs(n); return { neg, w: Math.floor(n / d), n: n % d, d }; }
const stack = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function mixedHTML(n, d) { const f = fracParts(n, d); let s = ''; if (f.w || !f.n) s += f.w; if (f.n) s += (s ? ' ' : '') + stack(f.n, f.d); return (f.neg ? MINUS : '') + s; }

/* ================= state ================= */
const TOOLS = [], TOOL = {};
const defineTool = t => { TOOLS.push(t); TOOL[t.id] = t; };
const S = {
  tool: null, data: {}, views: {}, undo: {}, sel: null, show: true,
  role: 'solo', task: null, taskMin: false, progress: [], seen: {}, coachInk: {}, custom: [], build: null, set: null, lastSet: null,
  pen: { on: false, color: 0, erase: false },
};
const app = { W: 1, H: 1, popIds: new Set(), cascade: 0, trayItems: [], ctxActs: [] };
let active = null;
const tool = () => TOOL[S.tool];
const data = () => S.data[S.tool];
// The parent's phone mirrors the kid's board, except while it builds a board for a new task.
const isCoach = () => S.role === 'coach' && !S.build;
const findP = (d, id) => (d.pieces || []).find(p => p.id === id);
const removeP = (d, id) => { d.pieces = d.pieces.filter(p => p.id !== id); };
// Values (readouts, row totals) are hidden from the kid while a task asks them to work it out.
function showVals() {
  if (!S.show) return false;
  if (isCoach()) return true;
  if (S.set) return false; // contest practice: no readouts until it is scored
  if (!S.task) return true;
  const t = getTask(S.task.id);
  return !(t && t.hide !== false && S.task.status !== 'ok');
}

/* ================= view ================= */
function view() {
  const t = tool();
  if (t.kind !== 'pieces') return { x: 0, y: 0, s: 1 };
  let v = S.views[t.id];
  if (!v || !isFinite(v.s) || !isFinite(v.x) || !isFinite(v.y)) {
    const s = clamp(Math.min(app.W / 520, app.H / 560), 0.55, 1.25);

}
function measure() { const r = app.wrap.getBoundingClientRect(); app.W = Math.max(1, Math.round(r.width)); app.H = Math.max(1, Math.round(r.height)); }
function toWorld(e) {
  const r = app.wrap.getBoundingClientRect(), v = view();

  const t = tool(), v = view();

  app.bg.setAttribute('x', vx); app.bg.setAttribute('y', vy); app.bg.setAttribute('width', vw); app.bg.setAttribute('height', vh);

    const g = t.grid;
    app.pat.setAttribute('width', g); app.pat.setAttribute('height', g);
    app.patBg.setAttribute('width', g); app.patBg.setAttribute('height', g);
    app.patLine.setAttribute('d', `M${g} 0H0V${g}`);
    app.bg.setAttribute('class', 'bg grid');

function zoomBy(f) { if (tool().kind !== 'pieces') return; const v = view(); v.s = clamp(v.s * f, 0.3, 3); applyView(); saveSoon(); }
// Zoom and pan so every piece (and any mat) is in view.
function fitView() {
  const t = tool(), d = data(); if (t.kind !== 'pieces') return;
  let b = t.extent ? t.extent(d) : null;
  const grow = (x, y) => { b = b ? { l: Math.min(b.l, x), t: Math.min(b.t, y), r: Math.max(b.r, x), b: Math.max(b.b, y) } : { l: x, t: y, r: x, b: y }; };
  for (const p of d.pieces) {
    const k = t.kinds[p.k]; if (!k) continue;
    const bx = k.box(p, d);
    for (const c of [[bx.x, bx.y], [bx.x + bx.w, bx.y], [bx.x, bx.y + bx.h], [bx.x + bx.w, bx.y + bx.h]]) {

  const v = view(); v.s = s; v.x = (b.l + b.r) / 2; v.y = (b.t + b.b) / 2 - (top - pad) / 2 / s;

}

  const SLOT = {
    h: i => ({ x: -150 + 10 * Math.floor(i / 2), y: (i % 2 ? 92 : -82) + 10 * Math.floor(i / 2) }),
    t: i => { const layer = Math.floor(i / 14), j = i % 14; return { x: -38 + 22 * (j % 7) + 6 * layer, y: (j >= 7 ? 92 : -82) + 6 * layer }; },
    o: i => { const layer = Math.floor(i / 85), j = i % 85; return { x: 137 + 22 * (j % 5) + 6 * layer, y: -152 + 22 * Math.floor(j / 5) + 6 * layer }; },
  };
  const bb = (k, x, y, r, inset = 0) => {
    let w = GRID[k][0] * U, h = GRID[k][1] * U; if (r) [w, h] = [h, w];
    return { l: x - w / 2 + inset, r: x + w / 2 - inset, t: y - h / 2 + inset, b: y + h / 2 - inset };
  };
  function freeSlot(k, d) {
    // first choice: a slot that overlaps nothing; fallback: a slot with no block of the same kind on it
    for (let i = 0; i < 400; i++) {
      const s = SLOT[k](i), a = bb(k, s.x, s.y, 0, 1);
      if (!d.pieces.some(p => { const q = bb(p.k, p.x, p.y, p.r); return q.l < a.r && q.r > a.l && q.t < a.b && q.b > a.t; })) return s;
    }
    for (let i = 0; i < 400; i++) {
      const s = SLOT[k](i);
      if (!d.pieces.some(p => p.k === k && Math.abs(p.x - s.x) < 5 && Math.abs(p.y - s.y) < 5)) return s;
    }
    return SLOT[k](0);
  }
  const HEAD = { int: ['Hundreds', 'Tens', 'Ones'], dec: ['Ones', 'Tenths', 'Hundredths'] };
  const ONE = { int: { h: 'Hundred', t: 'Ten', o: 'One' }, dec: { h: 'One', t: 'Tenth', o: 'Hundredth' } };
  const mode = d => (d.dec ? 'dec' : 'int');
  const count = d => { const n = { h: 0, t: 0, o: 0 }; for (const p of d.pieces) if (p.k in n) n[p.k]++; return n; };

  function breakApart(p, d) {
    const out = [];
    for (let i = 0; i < 10; i++) {
      const off = (i - 4.5) * (U + 3);
      if (p.k === 't') { const v = p.r ? [off, 0] : [0, off]; out.push({ id: uid(), k: 'o', x: r1(p.x + v[0]), y: r1(p.y + v[1]), r: 0 }); }
      else out.push({ id: uid(), k: 't', x: r1(p.x + off), y: p.y, r: 0 });
    }
    removeP(d, p.id); d.pieces.push(...out); out.forEach(q => app.popIds.add(q.id)); S.sel = null;
  }
  function trade(p, d) {
    const same = d.pieces.filter(q => q.k === p.k)
      .sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y)).slice(0, 10);
    if (same.length < 10) return;
    const ids = new Set(same.map(q => q.id));
    const cx = same.reduce((s, q) => s + q.x, 0) / 10, cy = same.reduce((s, q) => s + q.y, 0) / 10;
    d.pieces = d.pieces.filter(q => !ids.has(q.id));
    const k = p.k === 'o' ? 't' : 'h';
    const pos = d.mat ? freeSlot(k, d) : { x: r1(cx), y: r1(cy) };
    const np = { id: uid(), k, x: pos.x, y: pos.y, r: 0 };
    d.pieces.push(np); app.popIds.add(np.id); S.sel = null;
  }
  function example() {
    const d = { pieces: [], mat: true, dec: false, ink: [] };
    const add = (k, i) => { const s = SLOT[k](i); d.pieces.push({ id: uid(), k, x: s.x, y: s.y, r: 0 }); };
    add('h', 0); add('h', 1);
    for (let i = 0; i < 4; i++) add('t', i);
    for (let i = 0; i < 3; i++) add('o', i);
    return d;
  }

  // Builds a mat with the given counts in tidy slots (used by practice tasks).
  function build(spec, dec) {
    const d = { pieces: [], mat: true, dec: !!dec, ink: [] };
    for (const k of ['h', 't', 'o']) for (let i = 0; i < (spec[k] || 0); i++) { const s = SLOT[k](i); d.pieces.push({ id: uid(), k, x: s.x, y: s.y, r: 0 }); }
    return d;
  }

  defineTool({
    id: 'base-ten', short: 'Base Ten', kind: 'pieces', grid: U, center: { x: 0, y: 10 },
    init: example,
    api: { count, total: d => { const n = count(d); return n.h * 100 + n.t * 10 + n.o; }, build },
    extent: d => (d.mat ? { l: MAT.x0, t: MAT.top, r: MAT.x1, b: MAT.bottom } : null),
    kinds: {
      h: { draw: () => DRAWN.h, box: () => ({ x: -80, y: -80, w: 160, h: 160 }) },
      t: { rot: true, draw: () => DRAWN.t, box: () => ({ x: -8, y: -80, w: 16, h: 160 }) },
      o: { draw: () => DRAWN.o, box: () => ({ x: -8, y: -8, w: 16, h: 16 }) },
    },
    place(p, d) { if (!d.mat) return false; const s = freeSlot(p.k, d); p.x = s.x; p.y = s.y; return true; },
    acts(p, d) {
      const a = [], n = count(d);
      if (p.k !== 'o') a.push({ label: 'Break apart', icon: 'brk', fn: () => breakApart(p, d) });
      if (p.k !== 'h' && n[p.k] >= 10) a.push({ label: 'Trade 10', icon: 'trade', fn: () => trade(p, d) });
      if (p.k === 't') a.push({ label: 'Turn', icon: 'rotcw', fn: () => { p.r = p.r ? 0 : 90; } });
      a.push(dupAct(p, d), delAct(p, d));
      return a;
    },
    underlay(d) {
      if (!d.mat) return '';
      const names = HEAD[mode(d)];
      let s = `<rect class="mat" x="${MAT.x0}" y="${MAT.top}" width="${MAT.x1 - MAT.x0}" height="${MAT.bottom - MAT.top}" rx="14"/>`;
      s += `<path class="mat-div" d="M-55 ${MAT.top}V${MAT.bottom}M115 ${MAT.top}V${MAT.bottom}"/>`;
      MAT.cols.forEach(([a, b, k], i) => {
        s += `<text class="mat-h" x="${(a + b) / 2}" y="${MAT.top + 27}">${names[i]}</text>`;
        s += `<rect x="${a + 14}" y="${MAT.top + 37}" width="${b - a - 28}" height="3" rx="1.5" fill="${COL[k].f}"/>`;
      });
      return s;
    },
    readout(d) {
      const n = count(d), dec = d.dec, total = n.h * 100 + n.t * 10 + n.o;
      const big = dec ? (total / 100).toFixed(2) : total.toLocaleString('en-US');
      const w = dec ? [['one', 'ones'], ['tenth', 'tenths'], ['hundredth', 'hundredths']] : [['hundred', 'hundreds'], ['ten', 'tens'], ['one', 'ones']];
      const part = (c, [a, b]) => `${c} ${c === 1 ? a : b}`;
      let hint = '';
      if (n.o >= 10) hint = dec ? '10 hundredths can be traded for 1 tenth.' : '10 ones can be traded for 1 ten.';
      else if (n.t >= 10) hint = dec ? '10 tenths can be traded for 1 one.' : '10 tens can be traded for 1 hundred.';
      return `<div class="big">${big}</div><div class="sub">${part(n.h, w[0])} + ${part(n.t, w[1])} + ${part(n.o, w[2])}</div>` +
        (hint ? `<div class="hint">${hint} Tap one, then Trade 10.</div>` : '');
    },
    tray(d) {
      const nm = ONE[mode(d)];
      return [
        { h: 'Blocks', items: [
          { type: 'piece', k: 'h', label: nm.h, icon: `<g transform="scale(.24)">${DRAWN.h}</g>` },
          { type: 'piece', k: 't', label: nm.t, icon: `<g transform="scale(.26)">${DRAWN.t}</g>` },
          { type: 'piece', k: 'o', label: nm.o, icon: `<g transform="scale(1.3)">${DRAWN.o}</g>` },
        ] },
        { h: 'Options', items: [
          { type: 'toggle', label: 'Place-value mat', on: d.mat, fn: d => { d.mat = !d.mat; } },
          { type: 'toggle', label: 'Decimals', on: d.dec, fn: d => { d.dec = !d.dec; } },
          exampleItem(),
        ] },
      ];
    },
  });
})();

/* ================= Fraction Tiles ================= */
(() => {
  const FL = 400, FH = 40;
  const DEN = [1, 2, 3, 4, 5, 6, 8, 10, 12];
  const FC = { 1: C.red, 2: C.orange, 3: C.yellow, 4: C.green, 5: C.teal, 6: C.blue, 8: C.violet, 10: C.pink, 12: C.brown };
  const DEC = { 1: '1', 2: '0.5', 3: '≈0.33', 4: '0.25', 5: '0.2', 6: '≈0.17', 8: '0.125', 10: '0.1', 12: '≈0.08' };
  const PCT = { 1: '100%', 2: '50%', 3: '33⅓%', 4: '25%', 5: '20%', 6: '16⅔%', 8: '12.5%', 10: '10%', 12: '8⅓%' };
  const wOf = den => FL / den;

  function label(den, mode) {
    const w = wOf(den), c = FC[den];
    if (mode === 'none') return '';
    if (mode === 'frac' && den > 1) {
      const fs = Math.min(15, w / 2.3), bw = (String(den).length * 0.62 + 0.4) * fs / 2;
      return `<g class="fl" fill="${c.t}"><text x="0" y="-3.5" font-size="${r1(fs)}">1</text>` +
        `<path d="M${r1(-bw)} 0H${r1(bw)}" stroke="${c.t}" stroke-width="1.4"/>` +
        `<text x="0" y="${r1(fs * 0.84)}" font-size="${r1(fs)}">${den}</text></g>`;
    }
    const str = mode === 'dec' ? DEC[den] : mode === 'pct' ? PCT[den] : '1';
    const fs = Math.min(17, w / (str.length * 0.62 + 0.5));
    return `<text class="fl" x="0" y="${r1(fs * 0.36)}" font-size="${r1(fs)}" fill="${c.t}">${str}</text>`;
  }
  function tile(p, d) {
    const w = wOf(p.d), c = FC[p.d];
    return `<rect x="${r1(-w / 2)}" y="${-FH / 2}" width="${r1(w)}" height="${FH}" rx="3" fill="${c.f}" stroke="${c.s}" stroke-width="1.5"/>` + label(p.d, d.lbl || 'frac');
  }
  function row(den, y) {
    const out = [];
    for (let j = 0; j < den; j++) out.push({ id: uid(), k: 'f', d: den, x: r1(-FL / 2 + wOf(den) * (j + 0.5)), y, r: 0 });
    return out;
  }
  function example() { const d = { pieces: [], lbl: 'frac', ink: [] }; [1, 2, 4, 8, 3, 6].forEach((den, i) => d.pieces.push(...row(den, -100 + i * FH))); return d; }
  function wall(d) { d.pieces = []; DEN.forEach((den, i) => d.pieces.push(...row(den, -170 + i * FH))); S.sel = null; }
  function split(p, d, m) {
    const nd = p.d * m, w = wOf(nd), l = p.x - wOf(p.d) / 2;
    removeP(d, p.id);
    for (let j = 0; j < m; j++) { const q = { id: uid(), k: 'f', d: nd, x: r1(l + w * (j + 0.5)), y: p.y, r: 0 }; d.pieces.push(q); app.popIds.add(q.id); }
    S.sel = null;
  }
  // rows of touching tiles, top to bottom
  function chains(d) {
    const ps = d.pieces.filter(p => p.k === 'f').slice().sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    for (const p of ps) { let r = rows.find(q => Math.abs(q.y - p.y) < 6); if (!r) rows.push(r = { y: p.y, items: [] }); r.items.push(p); }
    const out = [];
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let cur = [], right = -Infinity;
      for (const p of r.items) {
        const w = wOf(p.d), l = p.x - w / 2;
        if (cur.length && Math.abs(l - right) > 6) { out.push(cur); cur = []; }
        cur.push(p); right = p.x + w / 2;
      }
      if (cur.length) out.push(cur);
    }
    return out;
  }
  const sum120 = ch => ch.reduce((s, p) => s + 120 / p.d, 0);
  function sumText(n, mode) {
    if (mode === 'dec') { const v = n / 120, r = Math.round(v * 100) / 100; return (Math.abs(v - r) > 1e-9 ? '≈' : '') + r; }
    if (mode === 'pct') { const v = n / 1.2, r = Math.round(v * 10) / 10; return (Math.abs(v - r) > 1e-9 ? '≈' : '') + r + '%'; }
    return mixedText(n, 120);
  }
  function exprHTML(ch) {
    const den = ch[0].d;
    if (ch.every(p => p.d === den)) return den === 1 ? String(ch.length) : stack(ch.length, den);
    if (ch.length > 4) return `${ch.length} tiles`;
    return ch.map(p => (p.d === 1 ? '1' : stack(1, p.d))).join(' + ');
  }
  const tileIcon = den => {
    const c = FC[den];
    return `<rect x="-20" y="-7" width="40" height="14" rx="2" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.2"/>` +
      `<rect x="-20" y="-7" width="${r1(40 / den)}" height="14" rx="2" fill="${c.f}" stroke="${c.s}" stroke-width="1.2"/>`;
  };

  // A row of exactly n tiles that are all 1/den.
  const hasRow = (d, den, n) => chains(d).some(ch => ch.length === n && ch.every(p => p.d === den));

  defineTool({
    id: 'fractions', short: 'Fractions', kind: 'pieces', grid: 20, center: { x: 0, y: 0 },
    init: example,
    api: { chains, hasRow, row },
    kinds: { f: { draw: tile, box: p => ({ x: -wOf(p.d) / 2, y: -FH / 2, w: wOf(p.d), h: FH }) } },
    make: (k, extra) => ({ d: DEN.includes(+extra) ? +extra : 1 }),
    onDrop(p, d) {
      const w = wOf(p.d); let best = null, bd = 20;
      for (const q of d.pieces) {
        if (q === p) continue;
        const qw = wOf(q.d);
        const cands = [
          { x: q.x + qw / 2 + w / 2, y: q.y }, { x: q.x - qw / 2 - w / 2, y: q.y },
          { x: q.x - qw / 2 + w / 2, y: q.y + FH }, { x: q.x - qw / 2 + w / 2, y: q.y - FH },
        ];
        for (const c of cands) { const dd = Math.hypot(c.x - p.x, c.y - p.y); if (dd < bd) { bd = dd; best = c; } }
      }
      if (best) { p.x = r1(best.x); p.y = r1(best.y); }
    },
    acts(p, d) {
      const a = [];
      for (const m of [2, 3]) if (DEN.includes(p.d * m)) a.push({ label: `Split in ${m}`, icon: m === 2 ? 'split' : 'split3', fn: () => split(p, d, m) });
      a.push(dupAct(p, d, q => { q.x = r1(p.x + wOf(p.d)); q.y = p.y; }), delAct(p, d));
      return a;
    },
    overlay(d) {
      if (!showVals()) return '';
      const mode = !d.lbl || d.lbl === 'none' ? 'frac' : d.lbl;
      return chains(d).filter(ch => ch.length > 1).map(ch => {
        const last = ch[ch.length - 1];
        return `<text class="rowsum" x="${r1(last.x + wOf(last.d) / 2 + 9)}" y="${r1(last.y + 6)}">= ${sumText(sum120(ch), mode)}</text>`;
      }).join('');
    },
    readout(d) {
      const p = S.sel && findP(d, S.sel);
      if (p) {
        return `<div class="big">${p.d === 1 ? '1' : stack(1, p.d)} = ${DEC[p.d]} = ${PCT[p.d]}</div>` +
          `<div class="sub">${p.d === 1 ? 'This tile is the whole.' : `${p.d} of these tiles make 1 whole.`}</div>`;
      }
      if (!d.pieces.length) return `<div class="sub">Add tiles from the tray and line them up to compare.</div>`;
      const groups = new Map();
      for (const ch of chains(d)) { const s = Math.round(sum120(ch)); if (!groups.has(s)) groups.set(s, []); groups.get(s).push(ch); }
      let best = null;
      for (const [s, list] of groups) if (list.length > 1 && (!best || list.length > best[1].length)) best = [s, list];
      if (!best) return `<div class="sub">Line tiles up in rows. Rows of the same length are equivalent. Tap a tile to see its value.</div>`;
      const seen = new Set(), exprs = [];
      for (const ch of best[1]) { const e = exprHTML(ch); if (!seen.has(e)) { seen.add(e); exprs.push(e); } }
      const val = mixedHTML(best[0], 120);
      if (!seen.has(val)) exprs.push(val);
      return `<div class="big">${exprs.join(' = ')}</div><div class="sub">These rows are the same length, so they are equivalent.</div>`;
    },
    tray(d) {
      const lbl = d.lbl || 'frac';
      return [
        { h: 'Tiles', items: DEN.map(den => ({ type: 'piece', k: 'f', extra: den, label: den === 1 ? '1 whole' : `1/${den}`, icon: tileIcon(den) })) },
        { h: 'Labels', items: [['frac', 'Fraction'], ['dec', 'Decimal'], ['pct', 'Percent'], ['none', 'None']].map(([v, l]) => ({ type: 'toggle', label: l, on: lbl === v, fn: d => { d.lbl = v; } })) },
        { h: 'Build', items: [{ type: 'btn', label: 'Full fraction wall', fn: d => wall(d) }, exampleItem()] },
      ];
    },
  });
})();

/* ================= Number Line ================= */
(() => {
  const PRE = [
    { id: '0-10', label: '0 to 10', i0: 0, i1: 10, un: 1, ud: 1 },
    { id: '0-20', label: '0 to 20', i0: 0, i1: 20, un: 1, ud: 1 },
    { id: '0-100', label: '0 to 100 by tens', i0: 0, i1: 10, un: 10, ud: 1 },

    { id: 'tenths', label: '0 to 1 in tenths', i0: 0, i1: 10, un: 1, ud: 10, dec: true },

    { id: 'eighths', label: '0 to 1 in eighths', i0: 0, i1: 8, un: 1, ud: 8 },
  ];
  const preset = d => PRE.find(p => p.id === d.preset) || PRE[1];
  function val(pr, i, html) {
    const n = i * pr.un, dd = pr.ud, neg = n < 0, a = Math.abs(n);
    let s;
    if (dd === 1) s = String(a);
    else if (pr.dec) s = String(Math.round((a / dd) * 1000) / 1000);
    else if (a % dd === 0) s = String(a / dd);
    else s = html ? stack(a, dd) : `${a}/${dd}`;
    return (neg ? MINUS : '') + s;
  }
  function lay(pr) {
    const m = Math.max(30, app.W * 0.07), x0 = -app.W / 2 + m, x1 = app.W / 2 - m;
    const n = pr.i1 - pr.i0, gap = (x1 - x0) / n;
    const y = r1(Math.min(app.H / 2 - 56, Math.max(Math.min(60, app.H * 0.1), -app.H / 2 + hudTop() + 130)));
    let maxLen = 0; for (let i = pr.i0; i <= pr.i1; i++) maxLen = Math.max(maxLen, val(pr, i).length);
    const need = maxLen * 7.5 + 10;
    const every = [1, 2, 4, 5, 10].find(k => gap * k >= need && n % k === 0) || n;
    return { x0, x1, gap, y, every, X: i => x0 + (i - pr.i0) * gap, I: x => clamp(Math.round((x - x0) / gap) + pr.i0, pr.i0, pr.i1) };
  }
  function jumpSVG(L, pr, j, k) {
    const xa = L.X(j.a), xb = L.X(j.b), fwd = j.b > j.a, dx = xb - xa;
    const h = clamp(Math.abs(dx) * 0.45, 26, 120) * (fwd ? -1 : 1);
    const y0 = L.y + (fwd ? -3 : 3), cx = (xa + xb) / 2, cy = y0 + 2 * h;
    const tx = xb - cx, ty = y0 - cy, tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl;
    const ah = `${r1(xb)},${r1(y0)} ${r1(xb - ux * 11 - uy * 6)},${r1(y0 - uy * 11 + ux * 6)} ${r1(xb - ux * 11 + uy * 6)},${r1(y0 - uy * 11 - ux * 6)}`;
    const lab = (fwd ? '+' : MINUS) + val(pr, Math.abs(j.b - j.a));
    const ly = y0 + h + (fwd ? -8 : 20);
    const path = `M${r1(xa)} ${r1(y0)}Q${r1(cx)} ${r1(cy)} ${r1(xb)} ${r1(y0)}`;
    const sel = S.sel === 'j' + k ? ' sel' : '';
    return `<g class="nl-jump ${fwd ? 'fwd' : 'back'}${sel}"${k >= 0 ? ` data-jump="${k}"` : ''}>` +
      `<path class="hit" d="${path}" stroke-width="22"/><path class="arc" d="${path}"/><polygon class="ah" points="${ah}"/>` +
      `<text class="nl-jl" x="${r1(cx)}" y="${r1(ly)}">${lab}</text></g>`;
  }

  defineTool({
    id: 'number-line', short: 'Number Line', kind: 'custom',
    init: () => ({ preset: '0-20', jumps: [{ a: 8, b: 10 }, { a: 10, b: 15 }], marks: [], hide: false, ink: [] }),
    valid: d => Array.isArray(d.jumps) && Array.isArray(d.marks),
    frame(d) { const L = lay(preset(d)); return { ox: L.x0, oy: L.y, k: (L.x1 - L.x0) / 1000 }; },
    render(d) {
      const pr = preset(d), L = lay(pr);
      let s = `<line class="nl-axis" x1="${r1(L.x0 - 20)}" y1="${L.y}" x2="${r1(L.x1 + 20)}" y2="${L.y}"/>` +
        `<polygon class="nl-arrow" points="${r1(L.x1 + 30)},${L.y} ${r1(L.x1 + 18)},${L.y - 6} ${r1(L.x1 + 18)},${L.y + 6}"/>` +
        `<polygon class="nl-arrow" points="${r1(L.x0 - 30)},${L.y} ${r1(L.x0 - 18)},${L.y - 6} ${r1(L.x0 - 18)},${L.y + 6}"/>`;
      const marks = new Set(d.marks);
      for (let i = pr.i0; i <= pr.i1; i++) {
        const x = r1(L.X(i)), whole = (i * pr.un) % pr.ud === 0, t = whole ? 12 : 8;

    api: { meetAtPoint, sixths, polys: d => d.pieces.map(worldVerts), SH },
    kinds,
    underlay: d => targetSVG(d),
    extent: d => { if (!Array.isArray(d.target)) return null; const xs = d.target.flat().map(q => q[0]), ys = d.target.flat().map(q => q[1]); return { l: Math.min(...xs) - 60, t: Math.min(...ys) - 60, r: Math.max(...xs) + 60, b: Math.max(...ys) + 60 }; },
    onDrop(p, d) {
      const mine = worldVerts(p); let best = null, bd = 16;
      for (const q of d.pieces) {
        if (q === p || Math.hypot(q.x - p.x, q.y - p.y) > 170) continue;
        for (const a of mine) for (const b of worldVerts(q)) {
          const dd = Math.hypot(a[0] - b[0], a[1] - b[1]);
          if (dd < bd) { bd = dd; best = [b[0] - a[0], b[1] - a[1]]; }
        }
      }
      // With no block nearby, corners snap to the corners of a shape to cover.
      if (!best && Array.isArray(d.target)) {
        for (const a of mine) for (const poly of d.target) for (const b of poly) { const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (dd < bd) { bd = dd; best = [b[0] - a[0], b[1] - a[1]]; } }
      }
      if (best) { p.x = r1(p.x + best[0]); p.y = r1(p.y + best[1]); }
    },
    acts(p, d) {
      return [
        { label: 'Turn left', icon: 'rotccw', fn: () => { p.r = ((p.r || 0) + 330) % 360; } },
        { label: 'Turn right', icon: 'rotcw', fn: () => { p.r = ((p.r || 0) + 30) % 360; } },
        dupAct(p, d), delAct(p, d),
      ];
    },
    readout(d) {
      if (Array.isArray(d.target)) {
        const cv = coverage(d.pieces.map(worldVerts), d.target);
        return `<div class="big">${Math.round(cv.cover * 100)}% <small>of the shape covered</small></div><div class="sub">${d.pieces.length} ${plural(d.pieces.length, 'block')}${cv.fit < 0.97 && d.pieces.length ? ' \u00B7 some blocks stick out' : ''}</div>`;
      }
      if (!d.pieces.length) return `<div class="sub">Add blocks from the tray. A hexagon counts as 1 whole.</div>`;
      const n = {}; for (const p of d.pieces) n[p.k] = (n[p.k] || 0) + 1;
      const six = Object.keys(SIX).reduce((a, k) => a + (n[k] || 0) * SIX[k], 0);
      const parts = Object.keys(SIX).filter(k => n[k]).map(k => `${n[k]} ${n[k] === 1 ? NM[k][0] : NM[k][1]}`);
      const other = ['sq', 'thin'].filter(k => n[k]).map(k => NM[k][1]);
      const unit = six === 6 ? 'whole' : six < 6 && six > 0 ? 'of a whole' : 'wholes';
      return `<div class="big">${mixedHTML(six, 6)} <small>${unit}</small></div>` +
        `<div class="sub">${parts.join(' + ') || 'No hexagon-family blocks yet'}</div>` +
        `<div class="sub">Hexagon = 1 whole${other.length ? `. ${cap(other.join(' and '))} are not counted.` : ''}</div>`;
    },
    tray() {
      return [
        { h: 'Blocks', items: ORDER.map(k => ({ type: 'piece', k, label: LABEL[k], icon: `<g transform="scale(${ICON_SCALE[k]})">${DRAWN[k]}</g>` })) },
        { h: 'Options', items: [exampleItem(), { type: 'note', text: 'Blocks snap together at their corners.' }] },
      ];
    },
  });
})();

/* ================= Ten Frames ================= */
(() => {
  const CS = 54, CR = 21;
  const CC = { r: C.red, y: C.yellow };
  const ROWS = { f10: 2, f5: 1 };
  const hOf = p => ROWS[p.k] * CS;
  const cellPos = (k, i) => ({ x: -2 * CS + (i % 5) * CS, y: ROWS[k] === 2 ? (i < 5 ? -CS / 2 : CS / 2) : 0 });
  const counter = c => { const k = CC[c] || CC.r; return `<circle r="${CR}" fill="${k.f}" stroke="${k.s}" stroke-width="2"/><circle r="${r1(CR * 0.6)}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`; };
  function frame(p) {
    const w = 5 * CS, hh = hOf(p); let g = '';
    for (let i = 1; i < 5; i++) g += `M${-w / 2 + i * CS} ${-hh / 2}V${hh / 2}`;
    if (ROWS[p.k] === 2) g += `M${-w / 2} 0H${w / 2}`;
    let s = `<rect class="tf-frame" x="${-w / 2}" y="${-hh / 2}" width="${w}" height="${hh}" rx="6"/><path class="tf-grid" d="${g}"/>`;
    (p.cells || []).forEach((c, i) => { if (c) { const q = cellPos(p.k, i); s += `<g class="cnt" data-cell="${i}" transform="translate(${q.x} ${q.y})">${counter(c)}</g>`; } });
    return s;
  }
  const frameBox = p => ({ x: -2.5 * CS, y: -hOf(p) / 2, w: 5 * CS, h: hOf(p) });

  defineTool({
    id: 'ten-frames', short: 'Ten Frames', kind: 'pieces', grid: 27, center: { x: 0, y: 0 },
    init() {
      const f = (y, cells) => ({ id: uid(), k: 'f10', x: 0, y, r: 0, cells });
      const A = f(-70, ['r', 'r', 'r', 'r', 'r', 'r', 'r', 'y', 'y', 'y']);
      const B = f(70, ['y', 'y', null, null, null, null, null, null, null, null]);
      return { pieces: [A, B], last: B.id, ink: [] };
    },
    kinds: {
      f10: { draw: frame, box: frameBox },
      f5: { draw: frame, box: frameBox },
      cnt: { draw: p => counter(p.c), box: () => ({ x: -CR, y: -CR, w: 2 * CR, h: 2 * CR }) },
    },
    make: (k, extra) => (k === 'cnt' ? { c: extra === 'y' ? 'y' : 'r' } : { cells: Array(ROWS[k] * 5).fill(null) }),
    place(p, d) {
      const frames = d.pieces.filter(q => q.cells);
      if (p.k === 'cnt') {
        const f = frames.find(q => q.id === d.last && q.cells.includes(null)) || frames.find(q => q.cells.includes(null));
        if (f) { f.cells[f.cells.indexOf(null)] = p.c; d.last = f.id; return 'absorbed'; }
        return false;
      }
      if (!frames.length) return false;
      const low = frames.reduce((a, q) => (q.y + hOf(q) / 2 > a.y + hOf(a) / 2 ? q : a));
      const v = view(), y = r1(low.y + hOf(low) / 2 + 16 + hOf(p) / 2);
      if (y + hOf(p) / 2 > v.y + app.H / (2 * v.s) - 10) return false;
      p.x = low.x; p.y = y; d.last = p.id; return true;
    },
    pieceDown(p, e, pt, d) {
      if (p.k === 'cnt') return null;
      d.last = p.id;
      const ce = e.target.closest && e.target.closest('.cnt');
      if (!ce) return null;
      const i = +ce.dataset.cell, snap = snapshot(), sx = e.clientX, sy = e.clientY;
      let drag = null;
      return {
        move(q, ev) {
          if (drag) { drag.move(q, ev); return; }
          if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
          const c = p.cells[i]; p.cells[i] = null;
          const cnt = { id: uid(), k: 'cnt', x: r1(q.x), y: r1(q.y), r: 0, c };
          d.pieces.push(cnt);
          drag = startPieceDrag(cnt, q, ev, { snap, moved: true, off: { x: 0, y: 0 } });
          drag.move(q, ev);
        },
        up(q, ev, c) {
          if (drag) { drag.up(q, ev, c); return; }
          if (!c && p.cells[i]) { p.cells[i] = p.cells[i] === 'r' ? 'y' : 'r'; }
          if (snapshot() !== snap) pushUndo(snap);
          render(); saveSoon();
        },
      };
    },
    tap(p) { if (p.k !== 'cnt') return false; p.c = p.c === 'r' ? 'y' : 'r'; return true; },
    onDrop(p, d) {
      if (p.k !== 'cnt') return;
      const frames = d.pieces.filter(q => q.cells).reverse();
      for (const f of frames) {
        const lx = p.x - f.x, ly = p.y - f.y;
        if (Math.abs(lx) > 2.5 * CS + 14 || Math.abs(ly) > hOf(f) / 2 + 14) continue;
        let best = -1, bd = Infinity;
        f.cells.forEach((c, i) => { if (c) return; const q = cellPos(f.k, i), dd = Math.hypot(q.x - lx, q.y - ly); if (dd < bd) { bd = dd; best = i; } });
        if (best > -1) { f.cells[best] = p.c; removeP(d, p.id); d.last = f.id; return; }
      }
    },
    acts(p, d) {
      if (!p.cells) return null;
      return [
        { label: 'Fill', icon: 'fill', fn: () => { p.cells = p.cells.map(c => c || 'r'); } },
        { label: 'Empty', icon: 'empty', fn: () => { p.cells = p.cells.map(() => null); } },
        dupAct(p, d, q => { q.x = p.x; q.y = r1(p.y + hOf(p) + 16); }),
        delAct(p, d),
      ];
    },
    readout(d) {
      let r = 0, y = 0; const per = [];
      for (const p of d.pieces) {
        if (p.cells) { let n = 0; for (const c of p.cells) if (c) { n++; if (c === 'y') y++; else r++; } per.push(n); }
        else if (p.k === 'cnt') { if (p.c === 'y') y++; else r++; }
      }
      if (!r && !y && !per.length) return `<div class="sub">Add a ten frame, then tap a counter in the tray to fill it.</div>`;
      return `<div class="big">${r + y}</div><div class="sub">${r} red + ${y} yellow</div>` + (per.length > 1 ? `<div class="sub">In the frames: ${per.join(' + ')}</div>` : '');
    },
    tray() {
      return [
        { h: 'Frames and counters', items: [
          { type: 'piece', k: 'f10', label: 'Ten frame', icon: `<g transform="scale(.15)">${frame({ k: 'f10', cells: [] })}</g>` },
          { type: 'piece', k: 'f5', label: 'Five frame', icon: `<g transform="scale(.15)">${frame({ k: 'f5', cells: [] })}</g>` },
          { type: 'piece', k: 'cnt', extra: 'r', label: 'Red', icon: `<g transform="scale(.8)">${counter('r')}</g>` },
          { type: 'piece', k: 'cnt', extra: 'y', label: 'Yellow', icon: `<g transform="scale(.8)">${counter('y')}</g>` },
        ] },
        { h: 'Options', items: [exampleItem(), { type: 'note', text: 'Tap a counter to flip its color. Drag it out to move it.' }] },
      ];
    },
  });
})();

/* ================= Algebra Tiles ================= */
(() => {
  const XL = 90, UL = 20;
  const K = { x2: { w: XL, h: XL, c: C.blue, l: 'x²', fs: 24 }, x: { w: UL, h: XL, c: C.green, l: 'x', fs: 15 }, one: { w: UL, h: UL, c: C.amber, l: '1', fs: 11 } };
  const dims = p => (p.r ? { w: K[p.k].h, h: K[p.k].w } : { w: K[p.k].w, h: K[p.k].h });
  function draw(p) {
    const { w, h } = dims(p), k = K[p.k], c = p.neg ? C.red : k.c;
    return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="3" fill="${c.f}" stroke="${c.s}" stroke-width="1.5"/>` +
      `<text class="at-l" x="0" y="${r1(k.fs * 0.36)}" font-size="${k.fs}" fill="${c.t}">${p.neg ? MINUS : ''}${k.l}</text>`;
  }
  const snapGrid = p => { const { w, h } = dims(p); p.x = Math.round((p.x - w / 2) / 10) * 10 + w / 2; p.y = Math.round((p.y - h / 2) / 10) * 10 + h / 2; };
  const tally = ps => { const n = { x2: 0, x: 0, one: 0 }; for (const p of ps) if (p.k in n) n[p.k] += p.neg ? -1 : 1; return n; };
  function expr(n) {
    const terms = [];
    const add = (c, v) => { if (!c) return; const a = Math.abs(c); terms.push([c < 0, v ? (a === 1 ? '' : a) + v : String(a)]); };
    add(n.x2, 'x²'); add(n.x, 'x'); add(n.one, '');
    if (!terms.length) return '0';
    return terms.map(([neg, s], i) => (i ? ` ${neg ? MINUS : '+'} ` : neg ? MINUS : '') + s).join('');
  }
  const pairs = ps => ['x2', 'x', 'one'].reduce((z, k) => z + Math.min(ps.filter(p => p.k === k && !p.neg).length, ps.filter(p => p.k === k && p.neg).length), 0);
  const sides = d => (d.mat ? [d.pieces.filter(p => p.x < 0), d.pieces.filter(p => p.x >= 0)] : [d.pieces]);
  function removeZeroPairs(d) {
    let removed = 0;
    for (const side of sides(d)) for (const k of ['x2', 'x', 'one']) {
      const pos = side.filter(p => p.k === k && !p.neg), neg = side.filter(p => p.k === k && p.neg), m = Math.min(pos.length, neg.length);
      if (!m) continue;
      const kill = new Set([...pos.slice(-m), ...neg.slice(-m)].map(p => p.id));
      d.pieces = d.pieces.filter(p => !kill.has(p.id)); removed += m;
    }
    return removed;
  }
  function example() {
    const P = [];
    const add = (k, l, t, neg) => { const p = { id: uid(), k, x: 0, y: 0, r: 0, neg: !!neg }; const { w, h } = dims(p); p.x = l + w / 2; p.y = t + h / 2; P.push(p); };
    add('x', -220, -60); add('x', -190, -60);
    for (let i = 0; i < 3; i++) add('one', -150 + 30 * i, -60);
    for (let i = 0; i < 7; i++) add('one', 40 + 30 * i, -60);
    return { pieces: P, mat: true, ink: [] };
  }
  const box = p => { const { w, h } = dims(p); return { x: -w / 2, y: -h / 2, w, h }; };

  defineTool({
    id: 'algebra-tiles', short: 'Algebra Tiles', kind: 'pieces', grid: 10, center: { x: 0, y: 10 },
    init: example,
    kinds: { x2: { draw, box }, x: { draw, box }, one: { draw, box } },
    make: (k, extra) => ({ neg: extra === 'neg' }),
    place(p) {
      const v = view(), n = app.cascade = (app.cascade + 1) % 7;
      p.x = v.x + (n - 3) * 20; p.y = v.y + 30 / v.s + (n - 3) * 20; snapGrid(p); return true;
    },
    onDrop: p => snapGrid(p),
    acts(p, d) {
      const a = [{ label: 'Flip sign', icon: 'pm', fn: () => { p.neg = !p.neg; } }];
      if (p.k === 'x') a.push({ label: 'Turn', icon: 'rotcw', fn: () => { p.r = p.r ? 0 : 90; snapGrid(p); } });
      a.push(dupAct(p, d, q => snapGrid(q)), delAct(p, d));
      return a;
    },
    underlay(d) {
      if (!d.mat) return '';
      return `<rect class="mat" x="-250" y="-190" width="240" height="400" rx="14"/><rect class="mat" x="10" y="-190" width="240" height="400" rx="14"/>` +
        `<text class="mat-h" x="-130" y="-160">Left side</text><text class="mat-h" x="130" y="-160">Right side</text>` +
        `<circle class="eq-c" cx="0" cy="10" r="16"/><text class="eq-t" x="0" y="18">=</text>`;
    },
    readout(d) {
      if (!d.pieces.length) return `<div class="sub">Add tiles from the tray. Red tiles are negative.</div>`;
      const sd = sides(d), z = sd.reduce((a, s) => a + pairs(s), 0);
      let big, sub = '';
      if (d.mat) {
        const a = tally(sd[0]), b = tally(sd[1]);
        big = `${expr(a)} = ${expr(b)}`;
        if (!a.x2 && !b.x2) {
          if (a.x !== b.x) sub = `Balanced when x = ${ratHTML(b.one - a.one, a.x - b.x)}`;
          else if (a.x) sub = a.one === b.one ? 'True for every value of x' : 'No value of x balances this';
        }
      } else big = expr(tally(d.pieces));
      return `<div class="big">${big}</div>` + (sub ? `<div class="sub">${sub}</div>` : '') +
        (z ? `<div class="hint">${z} zero ${plural(z, 'pair')} can be removed.</div>` : '');
    },
    tray(d) {
      const it = (k, neg, label) => ({ type: 'piece', k, extra: neg ? 'neg' : '', label, icon: `<g transform="scale(${k === 'one' ? 1.4 : 0.4})">${draw({ k, neg, r: 0 })}</g>` });
      return [
        { h: 'Tiles', items: [it('x2', false, 'x²'), it('x', false, 'x'), it('one', false, '1'), it('x2', true, '−x²'), it('x', true, '−x'), it('one', true, '−1')] },
        { h: 'Options', items: [
          { type: 'toggle', label: 'Equation mat', on: d.mat, fn: d => { d.mat = !d.mat; } },
          { type: 'btn', label: 'Remove zero pairs', fn: d => { const n = removeZeroPairs(d); S.sel = null; toast(n ? `Removed ${n} zero ${plural(n, 'pair')}.` : 'No zero pairs to remove.'); } },
          exampleItem(),
        ] },
      ];
    },
    extent: d => (d.mat ? { l: -250, t: -190, r: 250, b: 210 } : null),
  });
})();

/* ================= Clock ================= */
(() => {
  const WORD = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  function lay() {
    const top = -app.H / 2 + hudTop(), bottom = app.H / 2 - 12;
    const R = Math.max(70, Math.min(app.W / 2 - 42, (bottom - top) / 2 - 26));
    return { cx: 0, cy: r1((top + bottom) / 2), R };
  }
  function words(h, m) {
    const nx = (h % 12) + 1;
    if (m === 0) return `${WORD[h]} o’clock`;
    if (m === 15) return `quarter past ${WORD[h]}`;
    if (m === 30) return `half past ${WORD[h]}`;
    if (m === 45) return `quarter to ${WORD[nx]}`;
    if (m < 30) return `${m} ${plural(m, 'minute')} past ${WORD[h]}`;
    return `${60 - m} ${plural(60 - m, 'minute')} to ${WORD[nx]}`;
  }
  function hand(id, ang, len, w, c, cx, cy) {
    const a = ang * Math.PI / 180, x2 = r1(cx + Math.sin(a) * len), y2 = r1(cy - Math.cos(a) * len);
    const xb = r1(cx - Math.sin(a) * len * 0.14), yb = r1(cy + Math.cos(a) * len * 0.14);
    return `<g data-hand="${id}"><line class="hit" x1="${xb}" y1="${yb}" x2="${x2}" y2="${y2}" stroke-width="36"/>` +
      `<line x1="${xb}" y1="${yb}" x2="${x2}" y2="${y2}" stroke="${c.f}" stroke-width="${r1(w)}" stroke-linecap="round"/></g>`;
  }

  defineTool({
    id: 'clock', short: 'Clock', kind: 'custom',
    init: () => ({ m: 225, mins: true, snap5: false, ink: [] }),
    valid: d => typeof d.m === 'number' && isFinite(d.m),
    frame() { const { cx, cy, R } = lay(); return { ox: cx, oy: cy, k: R / 500 }; },
    render(d) {
      const { cx, cy, R } = lay();
      let s = `<circle class="ck-face" cx="${cx}" cy="${cy}" r="${r1(R)}"/>`;
      for (let i = 0; i < 60; i++) {
        const a = i * Math.PI / 30, maj = i % 5 === 0, r0 = R * (maj ? 0.86 : 0.92), r2 = R * 0.96;
        s += `<line class="ck-tick${maj ? ' major' : ''}" x1="${r1(cx + Math.sin(a) * r0)}" y1="${r1(cy - Math.cos(a) * r0)}" x2="${r1(cx + Math.sin(a) * r2)}" y2="${r1(cy - Math.cos(a) * r2)}"/>`;
      }
      const fs = r1(R * 0.16);
      for (let n = 1; n <= 12; n++) {
        const a = n * Math.PI / 6, rr = R * 0.7;
        s += `<text class="ck-num" x="${r1(cx + Math.sin(a) * rr)}" y="${r1(cy - Math.cos(a) * rr + fs * 0.36)}" font-size="${fs}">${n}</text>`;
      }
      if (d.mins) {
        const ms = r1(clamp(R * 0.075, 10, 14));
        for (let m = 0; m < 60; m += 5) {
          const a = m * Math.PI / 30, rr = R + ms * 1.3;
          s += `<text class="ck-min" x="${r1(cx + Math.sin(a) * rr)}" y="${r1(cy - Math.cos(a) * rr + ms * 0.36)}" font-size="${ms}">${String(m).padStart(2, '0')}</text>`;
        }
      }
      s += hand('h', (d.m % 720) / 2, R * 0.5, R * 0.06, C.blue, cx, cy) + hand('m', (d.m % 60) * 6, R * 0.8, R * 0.038, C.red, cx, cy);
      return s + `<circle class="ck-cap" cx="${cx}" cy="${cy}" r="${r1(R * 0.045)}"/>`;
    },
    down(pt, e, d) {
      const { cx, cy, R } = lay(), dist = Math.hypot(pt.x - cx, pt.y - cy);
      const ang = p => (Math.atan2(p.x - cx, -(p.y - cy)) * 180 / Math.PI + 360) % 360;
      const adiff = (a, b) => { const x = Math.abs(a - b) % 360; return x > 180 ? 360 - x : x; };
      if (dist > R + 24) return { up() {} };
      // Grab the hand under the finger: near the middle means the short hour hand, farther out the minute hand.
      const a0 = ang(pt), ha = (d.m % 720) / 2, ma = (d.m % 60) * 6;
      let which, grabbed = true;
      if (dist < R * 0.58 && adiff(a0, ha) < 25) which = 'h';
      else if (dist < R * 0.92 && adiff(a0, ma) < 20) which = 'm';
      else { grabbed = false; which = dist < R * 0.62 && adiff(a0, ha) < adiff(a0, ma) ? 'h' : 'm'; }
      const snap = snapshot(); let prev = d.m % 60;
      const apply = p => {
        const a = ang(p); let m;
        if (which === 'm') {
          let mm = Math.round(a / 6) % 60;
          if (d.snap5) mm = (Math.round(mm / 5) * 5) % 60;
          let hr = Math.floor(d.m / 60);
          if (prev >= 45 && mm < 15) hr++; else if (prev < 15 && mm >= 45) hr--;
          prev = mm; m = hr * 60 + mm;
        } else {
          m = Math.round(a * 2) % 720;
          if (d.snap5) m = (Math.round(m / 5) * 5) % 720;
          prev = m % 60;
        }
        m = ((m % 720) + 720) % 720;
        if (m !== d.m) { d.m = m; render(); }
      };
      if (!grabbed) apply(pt); // tapping the face moves the nearest hand there
      return { move: apply, up() { if (snapshot() !== snap) pushUndo(snap); render(); saveSoon(); } };
    },
    readout(d) {
      const h = Math.floor(d.m / 60) % 12 || 12, mm = d.m % 60;

(() => {

    if (sz.some(v => v < MIN) && MIN * sz.length <= total) {

        const cx = r1(x + w / 2), cy = r1(y + h / 2);
        s += `<rect class="am-cell" data-cell="${i},${j}" x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" fill="${c.f}" fill-opacity=".16"/>`;

/* ================= Cubes (3D stacking, with top / front / side views) ================= */
(() => {
  const PAL = [C.blue, C.red, C.yellow, C.green];
  const NAMES = ['Blue', 'Red', 'Yellow', 'Green'];
  const SIZES = [3, 4, 5, 6];
  const MAXH = 8;
  const mix = (hex, t, to) => { const n = parseInt(hex.slice(1), 16); return '#' + [16, 8, 0].map(sh => Math.round(((n >> sh) & 255) * (1 - t) + to * t).toString(16).padStart(2, '0')).join(''); };

  // Grid cell (i, j) as seen after turning the board r quarter turns.
  const turn = (i, j, n, r) => (r === 1 ? [n - 1 - j, i] : r === 2 ? [n - 1 - i, n - 1 - j] : r === 3 ? [j, n - 1 - i] : [i, j]);

      const [u, v] = turn(i, j, n, d.view | 0);
      top.add(u + ',' + v); front[u] = Math.max(front[u], h); side[v] = Math.max(side[v], h);
    }
    return { top, front, side };
  }
  function lay(d) {
    const n = d.n, maxH = Math.max(4, ...d.cols.map(c => c.length));
    const panel = d.views && showVals() ? Math.min(150, 30 + Math.max(n, maxH) * 12) : 0;
    const top = -app.H / 2 + hudTop(), bottom = app.H / 2 - 16 - panel;
    const Hh = Math.max(120, bottom - top), W = app.W - 32;

    const n = d.n, V = viewsOf(d), maxH = Math.max(3, ...V.front, ...V.side);
    const q = clamp((app.W - 90) / (3 * n + 4), 6, 12), gap = 2 * q, total = 3 * n * q + 2 * gap;

    for (let v = 0; v < n; v++) for (let u = 0; u < n; u++) s += cell(x0 + u * q, y0 + v * q, V.top.has(u + ',' + v));
    const fx = x0 + n * q + gap, sx = fx + n * q + gap;
    s += `<text class="cu-vt" x="${r1(fx + n * q / 2)}" y="${r1(y0 - 6)}">Front</text><text class="cu-vt" x="${r1(sx + n * q / 2)}" y="${r1(y0 - 6)}">Right side</text>`;
    for (let u = 0; u < n; u++) for (let k = 0; k < maxH; k++) s += cell(fx + u * q, y0 + (maxH - 1 - k) * q, k < V.front[u]);
    for (let p = 0; p < n; p++) { const v = n - 1 - p; for (let k = 0; k < maxH; k++) s += cell(sx + p * q, y0 + (maxH - 1 - k) * q, k < V.side[v]); }
    return s;
  }
  function resize(d, n) {
    const cols = Array.from({ length: n * n }, () => []);
    for (let j = 0; j < Math.min(n, d.n); j++) for (let i = 0; i < Math.min(n, d.n); i++) cols[j * n + i] = d.cols[j * d.n + i];
    d.n = n; d.cols = cols;
  }
  // build(n, [[i, j, height, color?], ...]) -> a board state
  function build(n, spec, extra) {
    const d = Object.assign({ n, cols: Array.from({ length: n * n }, () => []), view: 0, mode: 'add', color: 0, views: true, ink: [] }, extra || {});

    id: 'cubes', short: 'Cubes', kind: 'custom',

    valid: d => Array.isArray(d.cols) && d.cols.length === d.n * d.n,
    api: { count, viewsOf, build },
    frame(d) { const L = lay(d); return { ox: L.ox, oy: L.oy, k: L.c / 40 }; },
    render(d) {

          const T = [[x, y - L.b], [x + L.a, y], [x, y + L.b], [x - L.a, y]];

          const right = [[x, y + L.b], [x + L.a, y], [x + L.a, y + L.c], [x, y + L.b + L.c]];

/* ---- contest practice: timed sets in each contest's format ---- */
// pick: how many problems of difficulty 1, 2, 3; pts: points for each difficulty.
const SETS = {
  kangaroo: { name: 'Kangaroo style', mins: 28, pick: [3, 3, 3], pts: [3, 4, 5], about: 'Choices A–E. 3, 4 or 5 points each' },
  moems: { name: 'MOEMS style', mins: 30, pick: [2, 2, 1], pts: [1, 1, 1], about: 'Number answers, hardest last' },
  noetic: { name: 'Noetic style', mins: 23, pick: [5, 3, 2], pts: [1, 1, 1], about: 'Half a contest, mostly number answers' },
};
const setSize = style => SETS[style].pick.reduce((a, b) => a + b, 0);
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
// Problems not solved yet come first; each difficulty is shuffled, and the set runs from easy to hard.
function pickSet(style) {
  const cfg = SETS[style], solved = taskStats(S.progress), pool = TASKS.filter(t => t.style === style);
  const shuffle = a => a.map(t => [Math.random(), t]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const ids = [];
  cfg.pick.forEach((k, i) => {
    const lv = pool.filter(t => t.diff === i + 1), done = t => solved[t.id] && solved[t.id].ok;
    ids.push(...shuffle(lv.filter(t => !done(t))).concat(shuffle(lv.filter(done))).slice(0, k).map(t => t.id));
  });
  for (const t of pool) if (ids.length < setSize(style) && !ids.includes(t.id)) ids.push(t.id);
  return ids;
}
function startSet(style, by = 'self') {
  if (!SETS[style] || isCoach()) return;
  const ids = pickSet(style); if (!ids.length) return;
  if (S.set) finishSet(false, true);
  S.task = null; S.taskMin = false; S.pen.on = false; S.pen.erase = false;
  const now = Date.now();
  S.set = { style, ids, i: 0, ans: {}, boards: {}, by, start: now, end: now + SETS[style].mins * 60000 };
  setGo(0, true); startSetTimer();
}
// Moves to problem i. Each problem keeps its own board, so scratch work is still there after going back.
function setGo(i, first) {
  const st = S.set; if (!st) return;
  const cur = getTask(st.ids[st.i]);
  if (!first && cur && S.data[cur.tool]) st.boards[cur.id] = JSON.stringify(S.data[cur.tool]);
  st.i = clamp(i, 0, st.ids.length - 1);
  const t = getTask(st.ids[st.i]); if (!t) return;
  if (S.tool !== t.tool) setTool(t.tool);
  let d = null; try { d = st.boards[t.id] ? JSON.parse(st.boards[t.id]) : null; } catch (_) { /* fresh board */ }
  S.data[t.tool] = d || t.setup(); ensureData(TOOL[t.tool]);
  S.undo[t.tool] = []; S.sel = null; app.tcSig = '';
  if (TOOL[t.tool].kind === 'pieces') { delete S.views[t.tool]; setTimeout(() => { if (S.tool === t.tool) fitView(); }, 0); }
  renderTray(); render(); saveSoon();
}
const stopSetTimer = () => { clearInterval(app.setT); app.setT = 0; };
function startSetTimer() {
  stopSetTimer();
  app.setT = setInterval(() => {
    const st = S.set; if (!st) { stopSetTimer(); return; }
    const left = st.end - Date.now(), el = document.getElementById('tcTimer');
    if (el) { el.textContent = mmss(left); el.classList.toggle('low', left < 120000); }
    if (left <= 0 && !isCoach()) finishSet(true);
  }, 1000);
}
// Scores the set. Every problem goes into the log (the parent sees it), plus one line for the whole set.
function finishSet(timeUp, quiet) {
  const st = S.set; if (!st || isCoach()) return;
  const cur = getTask(st.ids[st.i]); if (cur && S.data[cur.tool]) st.boards[cur.id] = JSON.stringify(S.data[cur.tool]);
  const cfg = SETS[st.style], now = Date.now();
  const rows = st.ids.map(id => {
    const t = getTask(id), a = st.ans[id], given = a != null && a !== '';
    let ok = false;
    if (t && given) { try { ok = !!t.check(null, a)[0]; } catch (_) { ok = false; } }
    const max = cfg.pts[((t && t.diff) || 1) - 1];
    return { id, ok, given, ans: given ? String(t && t.choices ? `${LETTERS[a]}) ${t.choices[a]}` : a) : '', pts: ok ? max : 0, max };
  });
  const score = rows.reduce((x, r) => x + r.pts, 0), max = rows.reduce((x, r) => x + r.max, 0), secs = Math.round((Math.min(now, st.end) - st.start) / 1000);
  for (const r of rows) { const e = { id: r.id, ok: r.ok, at: now, tries: 1, ans: r.ans, by: 'set', hint: false }; S.progress.push(e); liveLog(e); }
  const sum = { id: '__set', set: st.style, ok: score === max, at: now + 1, score, max, right: rows.filter(r => r.ok).length, n: rows.length, secs, by: st.by };
  S.progress.push(sum); liveLog(sum);
  S.lastSet = { style: st.style, rows, score, max, secs, timeUp: !!timeUp };
  S.set = null; stopSetTimer(); app.tcSig = '';
  renderTray(); render(); saveSoon();
  if (!quiet) openSetResults();
}
function openSetResults() {
  const r = S.lastSet; if (!r) return;
  const cfg = SETS[r.style], right = r.rows.filter(x => x.ok).length, points = cfg.pts[2] > 1;
  const list = r.rows.map((x, i) => { const t = getTask(x.id); return `<div class="res"><span class="${x.ok ? 'r-ok' : 'r-no'}" aria-label="${x.ok ? 'right' : 'not right'}">${x.ok ? '✓' : '✗'}</span><span class="t">${i + 1}. ${esc(t ? t.title : 'A problem')}${x.given ? '' : ' <span class="sub">· no answer</span>'}</span>` + (x.ok ? (points ? `<span class="sub">+${x.pts}</span>` : '') : `<button class="btn sm" type="button" data-retry="${x.id}">Try again</button>`) + '</div>'; }).join('');
  openSheet(`${cfg.name} practice`,
    `<div class="stats">${points ? `<div class="stat"><b>${r.score}/${r.max}</b><span>points</span></div>` : ''}<div class="stat"><b>${right}/${r.rows.length}</b><span>right</span></div><div class="stat"><b>${mmss(r.secs * 1000)}</b><span>${r.timeUp ? 'time ran out' : 'time used'}</span></div></div>` + list +
    `<p class="sub">Try again opens the problem by itself, with a hint and a Check button.</p><div class="btnrow"><button class="btn primary" type="button" data-again>Practice again</button><button class="btn" type="button" data-close>Close</button></div>`,
    body => body.addEventListener('click', e => {
      const rt = e.target.closest('[data-retry]'); if (rt) { closeSheet(); startTask(rt.dataset.retry, 'self'); return; }
      if (e.target.closest('[data-again]')) { closeSheet(); startSet(r.style, 'self'); return; }

// Last result for each style, for the buttons in the task list.
function setButtonsHTML(log, coach) {

function renderSetCard(el) {

    const s = stats[t.id], cls = s && s.ok ? 'ok' : s ? 'tried' : '';

      (editable && t.custom ? `<button type="button" class="ib sm" data-edit="${t.id}" aria-label="Edit ${esc(t.title)}" title="Edit">${icon('pen')}</button>` : '') + '</div>';

/* ---- transports: Firebase Realtime Database, or a same-browser channel used for testing ---- */
async function makeFirebase(cfg, room) {
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [A, D, Au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-database.js'), import(base + 'firebase-auth.js')]);
  const name = 'mb-' + room.slice(0, 8);
  const fapp = A.getApps().find(x => x.name === name) || A.initializeApp(cfg, name);
  const auth = Au.getAuth(fapp);
  if (!auth.currentUser) await Au.signInAnonymously(auth);
  const db = cfg.databaseURL ? D.getDatabase(fapp, cfg.databaseURL) : D.getDatabase(fapp);
  const r = p => D.ref(db, `rooms/${room}/${p}`);
  const conn = D.ref(db, '.info/connected');
  await D.get(r('meta')); // fails fast if the rules or the database URL are wrong
  return {
    kind: 'firebase',
    write: (p, v) => D.set(r(p), v),
    push: (p, v) => Promise.resolve(D.push(r(p), v)),
    watch(p, cb, o = {}) { const q = o.last ? D.query(r(p), D.limitToLast(o.last)) : r(p); return D.onValue(q, s => cb(s.val()), err => { LV.err = friendlyErr(err); liveChrome(); }); },
    onConn(cb) { return D.onValue(conn, s => cb(s.val() === true)); },
    presence(p) {
      const pr = r(p);
      D.onValue(conn, s => {
        if (s.val() !== true) return;
        D.onDisconnect(pr).set({ on: false, at: D.serverTimestamp() }).then(() => D.set(pr, { on: true, at: D.serverTimestamp() })).catch(() => {});
      });
    },
  };
}
function makeLocal(room) {
  // One tree per room, like the real database, kept in this browser. Used for testing on one computer.
  // Messages carry the written value: storage can lag behind the message in another tab.
  const ch = new BroadcastChannel('mathbench-' + room), KEYL = 'mbl.' + room, subs = [];
  let tree = {}; try { tree = JSON.parse(localStorage.getItem(KEYL) || '{}') || {}; } catch (_) { /* ignore */ }
  const parts = p => String(p).split('/').filter(Boolean);
  const get = p => { let o = tree; for (const k of parts(p)) { if (!o || typeof o !== 'object' || !(k in o)) return null; o = o[k]; } return o == null ? null : JSON.parse(JSON.stringify(o)); };
  const set = (p, v) => {
    const ks = parts(p); let o = tree;
    for (const k of ks.slice(0, -1)) { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
    if (v == null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const related = (a, b) => a === b || a.startsWith(b + '/') || b.startsWith(a + '/');
  const emit = p => { for (const s of subs.slice()) if (related(s.p, p)) s.cb(get(s.p)); };
  ch.onmessage = e => { set(e.data.p, e.data.v); emit(e.data.p); };

    v = v == null ? null : JSON.parse(JSON.stringify(v)); set(p, v);
    try { localStorage.setItem(KEYL, JSON.stringify(tree)); } catch (_) { /* full */ }
    ch.postMessage({ p, v }); emit(p); return Promise.resolve();
  };

    kind: 'local',
    write,
    push: (p, v) => write(`${p}/k${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, v),
    watch(p, cb) { const sub = { p, cb }; subs.push(sub); setTimeout(() => cb(get(p)), 0); return () => { const i = subs.indexOf(sub); if (i > -1) subs.splice(i, 1); }; },
    onConn(cb) { setTimeout(() => cb(true), 0); return () => {}; },
    presence(p) { write(p, { on: true, at: Date.now() }); addEventListener('pagehide', () => write(p, { on: false, at: Date.now() })); },

}
function friendlyErr(e) {
  const s = String((e && (e.code || e.message)) || e || '');

  if (/permission[_ ]denied/i.test(s)) return 'The database refused access. Paste the rules from database.rules.json into Realtime Database → Rules, then Publish.';
  if (/api-key|invalid-api-key|API key/i.test(s)) return 'That Firebase config did not work. Copy it again from Project settings → Your apps.';
  if (/dynamically imported module|import|Failed to fetch|NetworkError|Load failed/i.test(s)) return 'Could not load Firebase. Live mode needs your hosted copy of Thinkbit and an internet connection.';
  if (/databaseURL|database URL|Cannot parse Firebase url|FIREBASE FATAL/i.test(s)) return 'The database URL looks wrong. Copy it from Realtime Database → Data (it ends in firebaseio.com or firebasedatabase.app).';

}
